<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="dev.css" />
  </head>
  <body>
<!-- Here is the sidebar with the links to other pages within it - We can implement react to get it working-->

<!-- The sidebar code end would be here -->

<!-- Here is the main content of the webpage-->
    <div class="MainContent">

<!-- This is where the kainos logo will go, central in the main content div -->
      <div class="KainosLogo"></div>


<!-- This is where the floating suggestions will be found as designated in the figma design-->
      <div class="FloatingSpace">
        <div class ="SuggestionBubble">Suggestion one</div>
      </div>

<!-- This is where the chat box icon and linking button is going to be -->
      <div class="ChatButton">
        <a href="chat.html">
          <!-- This image needs to be brought in-->
            <img src="ChatIcon.png" alt="Chat Icon">
        </a>
      </div>

 <!-- This is the Upcoming Task board and it can be added to with the JS based on the tasks in the database-->
      <div class="MainTaskBox">
        <div id="Title">Upcoming Tasks</div>
        <div class="TaskItem">
            <div class="TaskBlockDate">8:00</div>
            <div class="TaskBlockText">Meet Juan</div>
            <div class="TaskCheckdot"></div>
        </div>
        <div class="TaskItem">
            <div class="TaskBlockDate">12:00</div>
            <div class="TaskBlockText">Lara</div>
            <div class="TaskCheckdot"></div>
        </div>
        <div class="TaskItem">
            <div class="TaskBlockDate">15:00</div>
            <div class="TaskBlockText">sigma</div>
            <div class="TaskCheckdot"></div>
        </div>
      </div>
<!-- This is the time spent box, with the insights image and the timed tags-->
      <div class="TimeSpentBox">
        <div id="Title">Time spent:</div>
        <div class="TimedItem">
            <div class="TimedTag">Worked on CSS:</div>
            <div class="TimedTime">03:30:00</div>
        </div>
      </div>
<!-- This is the workflow box, with the information and links to the different workflows that have been developed-->
      <div class="WorkflowBox">
        <div id="Title">Current Workflows</div>
        <div class="WorkflowItem">
            <div class="WorkflowText">Workflow #1</div>
        </div>
      </div>

<!-- This is the daily brief box, with the information about how many tasks are yet to complete or such -->
      <div class="DailyBriefBox">
        <div id="Title">Daily Tasks</div>
        <div class="DailyItem">
            <div class="DailyText">You have 3 tasks to complete</div>
        </div>
      </div>



      
    </div>
    
    
  </body>
</html>
