<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="dev.css" />
  </head>
  <body>
    <div class="main-dashboard">
      <div class="rectangle-BG"></div>
      <img class="image-kainos" src="img/image-kainos.png" />
      <div class="speech-button">
        <img class="ellipse-speechbubble" src="img/ellipse-speechbubble.svg" />
        <img class="polygon-speechbubble" src="img/polygon-speechbubble.svg" />
      </div>
      <div class="suggestion">
        <div class="div"></div>
        <div class="text-wrapper">Check Calender</div>
      </div>
      <div class="suggestion-2">
        <div class="div"></div>
        <div class="text-wrapper-2">Log a meeting</div>
      </div>
      <img class="account-circle" src="img/account-circle.svg" />
      <div class="notif">
        <img class="notifications" src="img/notifications.svg" />
        <div class="badges"><div class="badge-label">3</div></div>
      </div>
      <div class="brief-board">
        <div class="rectangle"></div>
        <div class="text-wrapper-3">Daily Brief:</div>
        <div class="rectangle-2"></div>
        <p class="p">You have 3 Tasks today!</p>
      </div>
 <!-- This is the Upcoming Task board and it can be added to with the JS based on the tasks in the database-->
      <div class="MainTaskBox">
        <div id="TaskTitle">Upcoming Tasks</div>
        <div class="TaskItem">
            <div class="TaskBlockDate">8:00</div>
            <div class="TaskBlockText">Meet Juan</div>
            <div class="TaskCheckdot"></div>
        </div>
        <div class="TaskItem">
            <div class="TaskBlockDate">12:00</div>
            <div class="TaskBlockText">Lara</div>
            <div class="TaskCheckdot"></div>
        </div>
        <div class="TaskItem">
            <div class="TaskBlockDate">15:00</div>
            <div class="TaskBlockText">sigma</div>
            <div class="TaskCheckdot"></div>
        </div>
      </div>

      <div class="timespent-board">
        <div class="rectangle-7"></div>
        <div class="text-wrapper-11">Time Spent:</div>
        <div class="rectangle-8"></div>
        <div class="rectangle-9"></div>
        <div class="rectangle-10"></div>
        <div class="text-wrapper-12">VS Code</div>
        <div class="text-wrapper-13">Teams</div>
        <div class="text-wrapper-14">Overall Productivity</div>
        <div class="text-wrapper-15">2 Hours</div>
        <div class="text-wrapper-16">30 Minutes</div>
        <img class="circular" src="img/circular-indeterminate-progress-indicator.svg" />
        <div class="text-wrapper-17">74%</div>
      </div>
      <div class="WF-board">
        <div class="rectangle-11"></div>
        <div class="text-wrapper-18">Your Workflows:</div>
        <div class="rectangle-12"></div>
        <div class="rectangle-13"></div>
        <div class="text-wrapper-19">Workflow #1</div>
        <div class="text-wrapper-20">Workflow #2</div>
      </div>
      <div class="suggestion-3">
        <div class="div"></div>
        <div class="text-wrapper-21">Set a reminder</div>
      </div>
      <img class="settings" src="img/settings.svg" />
      <img class="schedule" src="img/schedule.svg" />
      <img class="stars" src="img/stars.svg" />
      <img class="today" src="img/today.svg" />
      <img class="chat-bubble" src="img/chat-bubble.svg" />
      <img class="loader" src="img/loader.svg" />
    </div>
  </body>
</html>
