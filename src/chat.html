<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="./chat.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=[object Object]&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=[object Object]&display=swap" />  <!-- import the fonts --> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <title>Chat Page</title>
  </head>
  <body>

    <header>      
      <img src="assets/kainos-logo-vector.svg" class =image-kainos-icon  alt="kainos logo" />
      
    </header>
   
    <div class="chat" id = "chatContainer">
      



      <!-- Make the nav bar here. -->
       <!-- <nav id="mySidenav" class="sidenav">
          <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
          <a href="#">About</a>
          <a href="#">Services</a>
          <a href="#">Clients</a>
          <a href="#">Contact</a>
       </nav> -->


      
        <div class = "intro-block" id = "introBlock">
         

            <div class="custom-prompt">Hello. How's your day going?</div>

     

          <img class="mic-icon" alt="wave mic" src ="assets/mic.png" />
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="conversation">
          <div class="reply" id="replyContainer">
            <textarea id="chatInput" class="label" placeholder="How can I help?" rows = "1"></textarea>
            <button id="sendBtn"><i class="fas fa-arrow-up"></i></button>  
            <!-- the above will show the send button  -->
            <i class="fas fa-microphone chat-mic-icon"></i>
          </div>

        </div>

        <div class="spacer" id="bottomSpacer"></div>

        
    

    </div>
    <script src="chat.js"></script>
  </body>
</html>
