<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Workflow Hub</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="workflowStyle.css" />
  </head>
  <body>
    <div class="workflow-hub">
      <img class="intersect" src="img/intersect.svg" alt="Background decoration" />
      <img class="image-kainos" src="img/image-kainos.png" alt="Kainos logo" />
      <img class="polygon-speechbubble" src="img/polygon-speechbubble.svg" alt="Speech bubble decoration" />
      <aside class="rectangle-sideboard" role="navigation" aria-label="Main navigation">
        <div class="text-wrapper">Log   o</div>
        <nav>
          <button class="nav-button" aria-label="Chat">
            <img class="chat-bubble" src="img/chat-bubble.svg" alt="" />
          </button>
          <button class="nav-button" aria-label="Today">
            <img class="today" src="img/today.svg" alt="" />
          </button>
          <button class="nav-button" aria-label="Schedule">
            <img class="schedule" src="img/schedule.svg" alt="" />
          </button>
          <button class="nav-button" aria-label="Stars">
            <img class="stars" src="img/stars.svg" alt="" />
          </button>
          <button class="nav-button" aria-label="Loader">
            <img class="loader" src="img/loader.svg" alt="" />
          </button>
          <button class="nav-button" aria-label="Settings">
            <img class="settings" src="img/settings.svg" alt="" />
          </button>
        </nav>
      </aside>
      <header class="header-section">
        <h1 class="div">Workflow Hub</h1>
        <div class="header-actions">
          <button class="notifications-button" aria-label="Notifications">
            <img class="notifications" src="img/notifications.svg" alt="" />
            <span class="badges" aria-label="3 notifications">
              <span class="badge-label">3</span>
            </span>
          </button>
          <button class="account-button" aria-label="Account">
            <img class="account-circle" src="img/account-circle.svg" alt="" />
          </button>
        </div>
      </header>
      <main class="main-content">
        <section class="workflow-cards">
          <article class="component" role="article" aria-labelledby="task-1-title">
            <div class="property-rectangle">
              <div class="icon-wrapper">
                <img class="icon" src="img/icon.svg" alt="Task icon" />
              </div>
              <div class="img-wrapper">
                <img class="img" src="img/icon-3.svg" alt="" />
              </div>
            </div>
            <header class="property-task">
              <h2 class="text-wrapper-4" id="task-1-title">file organisation</h2>
            </header>
            <div class="property-rectangle-2"></div>
            <div class="property-ellipse" role="status" aria-label="Active status indicator"></div>
            <div class="div-wrapper">
              <p class="text-wrapper-5">task 1 description</p>
            </div>
            <footer class="property-status">
              <span class="text-wrapper-6">Status : Activate</span>
            </footer>
          </article>
          <article class="component-2" role="article" aria-labelledby="task-2-title">
            <div class="property-rectangle">
              <div class="settings-2">
                <img class="icon" src="img/icon-2.svg" alt="Task icon" />
              </div>
            </div>
            <header class="property-task-2">
              <h2 class="text-wrapper-7" id="task-2-title">meeting schedule</h2>
            </header>
            <div class="property-rectangle-2"></div>
            <div class="property-ellipse" role="status" aria-label="Active status indicator"></div>
            <div class="div-wrapper">
              <p class="text-wrapper-5">task 2 description</p>
            </div>
            <footer class="property-status">
              <span class="text-wrapper-6">Status : Activate</span>
            </footer>
          </article>
          <article class="component-3" role="article" aria-labelledby="task-3-title">
            <div class="property-rectangle">
              <div class="settings-3">
                <img class="icon" src="img/image.svg" alt="Task icon" />
              </div>
            </div>
            <header class="property-task-3">
              <h2 class="text-wrapper-8" id="task-3-title">Task 3</h2>
            </header>
            <div class="property-rectangle-2"></div>
            <div class="property-ellipse-2" role="status" aria-label="Inactive status indicator"></div>
            <div class="div-wrapper">
              <p class="text-wrapper-5">task 3 description</p>
            </div>
            <footer class="property-status">
              <span class="text-wrapper-9">Status : Inactivate</span>
            </footer>
          </article>
        </section>
        <aside class="metadata-section">
          <p class="text-wrapper-2">Teams</p>
          <p class="text-wrapper-3">2 Hours</p>
          <img class="polygon-speechbubble" src="img/polygon-speechbubble.svg" alt="Decoration" />
        </aside>
        <section class="new-workflow-section">
          <button class="component-4" aria-label="Create new workflow">
            <div class="property-rectangle-3"></div>
            <span class="property-new">
              <span class="text-wrapper-10">New workflow</span>
            </span>
            <img class="property-ellipse-3" src="img/property-1-ellipse-7.svg" alt="" />
          </button>
        </section>
      </main>
    </div>
  </body>
</html>
