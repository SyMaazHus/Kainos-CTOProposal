            <div class="workflow-cards">
                <div class="workflow-card status-active">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="file-org">file organisation</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 1 description</p>
                        </div>
                        <footer class="card-footer">
                          <!-- imgs -->
                            <button class="setting"></button>
                            <span class="card-status">Status : Activate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>

                <div class="workflow-card status-active">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="meeting-schedule">meeting schedule</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 2 description</p>
                        </div>
                        <footer class="card-footer">
                          <!-- imgs -->
                            <button class="setting"></button>
                            <span class="card-status">Status : Activate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>

                <div class="workflow-card status-inactive">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="task-3">Task 3</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 3 description</p>
                        </div>
                        <footer class="card-footer">
                            <button class="setting" src=""></button> 
                            <!-- imgs -->
                            <span class="card-status">Status : Inactivate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>
                  
              </div>

            <div class="new-workflow">
                <button class="new-workflow-btn">
                    <span class="plus">+</span>
                    New workflow
                </button>
            </div>
