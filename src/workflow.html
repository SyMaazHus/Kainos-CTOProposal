<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Workflow Hub</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="workflowStyle.css" />
  </head>
  <body>
    <div class="workflow-hub">
        <aside class="nav">
            <div class="nav-top">
                <div class="logo">Logo</div>
                <!-- imgs -->
            </div>
            <nav class="nav-mid">
                <ul>
                    <!-- imgs -->
                    <li><button class="nav-icon" aria-label="Calendar"></button></li>
                    <li><button class="nav-icon" aria-label="Time/History"></button></li>
                    <li><button class="nav-icon" aria-label="Favorites"></button></li>
                    <li><button class="nav-icon" aria-label="Spark/Processing"></button></li>
                </ul>
            </nav>
            <div class="nav-bottom">
                <button class="nav-icon" aria-label="Settings"></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 class="page-title">Workflow Hub</h1>
                <div class="header-right">
                    <!-- imgs -->
                    <img class="kainos-logo" src="" alt="kainos">
                    <button class="header-icon" aria-label="Notifications"></button>
                    <button class="header-icon" aria-label="User Account"></button>
                </div>
            </header>

            <div class="workflow-cards">
                <div class="workflow-card status-active">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="file-org">file organisation</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 1 description</p>
                        </div>
                        <footer class="card-footer">
                          <!-- imgs -->
                            <button class="setting"></button>
                            <span class="card-status">Status : Activate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>

                <div class="workflow-card status-active">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="meeting-schedule">meeting schedule</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 2 description</p>
                        </div>
                        <footer class="card-footer">
                          <!-- imgs -->
                            <button class="setting"></button>
                            <span class="card-status">Status : Activate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>

                <div class="workflow-card status-inactive">
                    <div class="inner-box">
                        <header class="card-header">
                            <h2 class="card-title" id="task-3">Task 3</h2>
                        </header>
                        <div class="card-description-box">
                            <p class="card-description">task 3 description</p>
                        </div>
                        <footer class="card-footer">
                            <button class="setting" src=""></button> 
                            <!-- imgs -->
                            <span class="card-status">Status : Inactivate</span>
                            <div class="status-color"></div>
                        </footer>
                    </div>
                  </div>
                  
              </div>

            <div class="new-workflow">
                <button class="new-workflow-btn">
                    <span class="plus">+</span>
                    New workflow
                </button>
            </div>
        </main>
    </div>
</body>
</html>
