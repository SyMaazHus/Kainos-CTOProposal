<html lang="en">

    <script src="navbar.js"></script>

                    </button>
                </div>
            </header>
            <!-- div element contain workflow cards -->
            <div class="workflow-cards">
            </div>
            <div class="new-workflow">
                <button class="new-workflow-btn" id="addButton">
                    <span class="plus">+</span>
                    New workflow
                </button>
            </div>
            <!-- pop up form for new task -->
            <div class="pop-up" id="newCardForm">
                <div class="new-card">
                    <span class="close-button" id="closeBtn">&times;</span>
                    <h2 class="card-title">Create new workflow</h2>
                    <form class="new-workflow-form" id="newForm">
                        <div class="input-section">
                            <label for="task-name">Task name</label>
                            <input type="text" id="taskName" required>
                        </div>
                        <div class="input-section">
                            <label for="task-description">Task description</label>
                           <textarea id="taskDescription" required></textarea>
                        </div>
                        <div class="new-card-button">
                            <button type="submit" class="submit-button" id="submitNew">Add workflow</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- pop up for delete task -->
            <div class="pop-up" id="deleteBlock">
                <div class="delete-question">
                    <h3>Delete Workflow?</h3>
                    <p>Are you sure you want to delete <span id="fillTaskName"></span> workflow?</p>
                    <div class="button-label">
                        <button class="cancel-button" id="deleteCancel">Cancel</button>
                        <button class="delete-button" id="deleteConfirm">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
