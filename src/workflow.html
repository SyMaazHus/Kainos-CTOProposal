<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="workflow-hub">
      <img class="intersect" src="img/intersect.svg" />
      <img class="image-kainos" src="img/image-kainos.png" />
      <img class="polygon-speechbubble" src="img/polygon-speechbubble.svg" />
      <div class="rectangle-sideboard"></div>
      <img class="account-circle" src="img/account-circle.svg" />
      <img class="notifications" src="img/notifications.svg" />
      <img class="settings" src="img/settings.svg" />
      <div class="badges"><div class="badge-label">3</div></div>
      <img class="today" src="img/today.svg" />
      <img class="schedule" src="img/schedule.svg" />
      <img class="stars" src="img/stars.svg" />
      <img class="chat-bubble" src="img/chat-bubble.svg" />
      <div class="text-wrapper">Logo</div>
      <div class="div">Workflow Hub</div>
      <div class="text-wrapper-2">Teams</div>
      <div class="text-wrapper-3">2 Hours</div>
      <div class="component">
        <div class="property-rectangle">
          <div class="icon-wrapper"><img class="icon" src="img/icon.svg" /></div>
          <div class="img-wrapper"><img class="img" src="img/icon-3.svg" /></div>
        </div>
        <div class="property-task"><div class="text-wrapper-4">file organisation</div></div>
        <div class="property-rectangle-2"></div>
        <div class="property-ellipse"></div>
        <div class="div-wrapper"><div class="text-wrapper-5">task 1 description</div></div>
        <div class="property-status"><div class="text-wrapper-6">Status : Activate</div></div>
      </div>
      <div class="component-2">
        <div class="property-rectangle">
          <div class="settings-2"><img class="icon" src="img/icon-2.svg" /></div>
        </div>
        <div class="property-task-2"><div class="text-wrapper-7">meeting schedule</div></div>
        <div class="property-rectangle-2"></div>
        <div class="property-ellipse"></div>
        <div class="div-wrapper"><div class="text-wrapper-5">task 2 description</div></div>
        <div class="property-status"><div class="text-wrapper-6">Status : Activate</div></div>
      </div>
      <div class="component-3">
        <div class="property-rectangle">
          <div class="settings-3"><img class="icon" src="img/image.svg" /></div>
        </div>
        <div class="property-task-3"><div class="text-wrapper-8">Task 3</div></div>
        <div class="property-rectangle-2"></div>
        <div class="property-ellipse-2"></div>
        <div class="div-wrapper"><div class="text-wrapper-5">task 3 description</div></div>
        <div class="property-status"><div class="text-wrapper-9">Status : Inactivate</div></div>
      </div>
      <div class="component-4">
        <div class="property-rectangle-3"></div>
        <div class="property-new"><div class="text-wrapper-10">New workflow</div></div>
        <img class="property-ellipse-3" src="img/property-1-ellipse-7.svg" />
      </div>
      <img class="loader" src="img/loader.svg" />
    </div>
  </body>
</html>
